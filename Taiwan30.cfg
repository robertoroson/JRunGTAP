# Taiwan30 — EU tariffs on electricity from Taiwan and China
# Replicates SaveSim/Taiwan30.exp (RunGTAP v3.75, GTAPUV7)
#
# Shock: tms on electricity imports
#   Taiwan → EU-4 regions: +10 pp
#   China  → EU-4 regions:  +5 pp

model  = v7
method = gragg
steps  = 3

shock  tms[Electricity, Taiwan,  Italia]   = 10.0
shock  tms[Electricity, Taiwan,  Francia]  = 10.0
shock  tms[Electricity, Taiwan,  Germania] = 10.0
shock  tms[Electricity, Taiwan,  RestoUE]  = 10.0
shock  tms[Electricity, China,   Italia]   =  5.0
shock  tms[Electricity, China,   Francia]  =  5.0
shock  tms[Electricity, China,   Germania] =  5.0
shock  tms[Electricity, China,   RestoUE]  =  5.0

# Unemployment closure for EU regions: fix unskilled wage (pe→exo), let employment (qe→endo)
swap   pe[UnSkLab, Italia]   <-> qe[UnSkLab, Italia]
swap   pe[UnSkLab, Francia]  <-> qe[UnSkLab, Francia]
swap   pe[UnSkLab, Germania] <-> qe[UnSkLab, Germania]
swap   pe[UnSkLab, RestoUE]  <-> qe[UnSkLab, RestoUE]
