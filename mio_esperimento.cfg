model  = v7
method = gragg
steps  = 6

# ── Coalizione sanzionatrice ──
set  SANCT = [Italia, Francia, Germania, RestoUE, RegnoUnito, Svizzera, USA, Canada, Giappone, CoreaSud, AustraliaNZ]

swap qxw("Computer","Taiwan") <-> aoall("Computer","Taiwan") fix_at = -30.0

# ── Cina -> coalizione: forte restrizione import autoveicoli cinesi da paesi sanzionanti ──
swap   qxs[Autoveicoli, China, SANCT] <-> tms[Autoveicoli, China, SANCT] fix_at = -70.0

# ── Aeromobili/ferroviario/navi: restrizione bilaterale moderata ──
swap   qxs[Auto_altro, China, SANCT]  <-> tms[Auto_altro, China, SANCT]  fix_at = -30.0
swap   qxs[Auto_altro, SANCT, China]  <-> tms[Auto_altro, SANCT, China]  fix_at = -30.0

# ── Servizi finanziari: divieto parziale di intermediazione verso la Cina (evita rendita di scarsità) ──
swap   qxs[FinServ, SANCT, China] <-> ams[FinServ, SANCT, China] fix_at = -60.0