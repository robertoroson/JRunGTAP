# ─────────────────────────────────────────────────────────────────────────────
# JRunGTAP experiment configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# Index syntax:
#   Named element : tm[pdr, Austria]       — names as they appear in the HAR sets
#   All elements  : tm[pdr, all]           — expands to all regions
#   Model set     : tm[TRAD_COMM, Austria] — all commodities into Austria
#   User set      : tm[agri, Austria]      — elements of the set defined below
#   Numeric       : tm[1, 1]               — 1-based integer (backward compat)
#
# Note: region and coomodity names are as stored in the HAR data (e.g. "Austria", "Francia").
#       Match is case-insensitive.
# ─────────────────────────────────────────────────────────────────────────────

# ── Solution Method ───────────────────────────────────────────────────────────
# method = johansen   single linearisation step (default; fast, less accurate for large shocks)
# method = euler      multi-step Euler: rebuilds Jacobian at the start of each sub-step (1st order)
# method = gragg      modified midpoint: rebuilds Jacobian at mid-step (2nd order; ~2× cost of euler)
# steps  = 10         number of sub-steps for euler/gragg (ignored for johansen)
# Method names are case-insensitive: Euler, EULER, euler are all accepted.

# ── Optional inline set definitions ──────────────────────────────────────────
# set  agri = [pdr, wht, gro, v_f, osd, c_b, pfb, ocr]

# ── Shocks ────────────────────────────────────────────────────────────────────
# Examples (uncomment to use):
# shock  tm[pdr, all]          = 10.0   # pdr tariff in ALL regions
# shock  tm[agri, Austria]     = 5.0    # all agri commodities into Austria
# shock  tm[TRAD_COMM, Austria] = 3.0   # all commodities into Austria

# ── Closure swaps ─────────────────────────────────────────────────────────────
# Examples (uncomment to use):
# swap  rental[Austria] <-> qo_endw[Land, Austria]
# swap  rental[Austria] <-> qo_endw[UnSkLab, Austria]
# swap  rental[Austria] <-> qo_endw[SkLab, Austria]
# swap  rental[Austria] <-> qo_endw[Capital, Austria]
