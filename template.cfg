# ─────────────────────────────────────────────────────────────────────────────
# JRunGTAP experiment configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# Index syntax:
#   Named element : tm[pdr, Austria]       — names as they appear in the HAR sets
#   All elements  : tm[pdr, all]           — expands to all regions
#   Model set     : tm[TRAD_COMM, Austria] — all commodities into Austria
#   User set      : tm[agri, Austria]      — elements of the set defined below
#   Numeric       : tm[1, 1]               — 1-based integer (backward compat)
#
# Note: region and commodity names are as stored in the HAR data (e.g. "Austria", "Francia").
#       Match is case-insensitive.
# ─────────────────────────────────────────────────────────────────────────────

# ── Model version ────────────────────────────────────────────────────────────
# model = v62   standard GTAP v6.2 (default; reads GTAPAgg3 v6.2 zip archives)
# model = v7    GTAP v7 (Corong et al. 2017; requires v7 HAR data archive with
#               MAKB/MAKS make matrix, EVOS/EVFB, activity-specific sets, etc.)
# When model = v7, the same zip archive path is used for v7 data loading.

# ── Solution Method ───────────────────────────────────────────────────────────
# method = johansen   single linearisation step (default; fast, less accurate for large shocks)
# method = euler      multi-step Euler: rebuilds Jacobian at the start of each sub-step (1st order)
# method = gragg      modified midpoint: rebuilds Jacobian at mid-step (2nd order; ~2× cost of euler)
# steps  = 10         number of sub-steps for euler/gragg (ignored for johansen)
# Method names are case-insensitive: Euler, EULER, euler are all accepted.

# ── Optional inline set definitions ──────────────────────────────────────────
# set  agri = [pdr, wht, gro, v_f, osd, c_b, pfb, ocr]
# set  eu4  = [Italia, Francia, Germania, RestoUE]

# ── Shocks ────────────────────────────────────────────────────────────────────
# Examples (uncomment to use):
# shock  tm[pdr, all]           = 10.0   # pdr import tariff in all regions
# shock  tm[agri, Austria]      =  5.0   # all agri commodities into Austria
# shock  tm[TRAD_COMM, Austria] =  3.0   # all commodities into Austria
# shock  tms[Electricity, Taiwan, Italia] = 10.0   # bilateral tariff (v7)

# ── Closure swaps ─────────────────────────────────────────────────────────────
# Syntax:
#   swap  <endo_var>[indices] <-> <exo_var>[indices]
#   swap  <endo_var>[indices] <-> <exo_var>[indices] fix_at = <value>
#
# The endo_var is fixed at fix_at (default 0 = no % change); the exo_var
# is freed to clear the market. Both variables must have the same dimension.
#
# ── 1. Factor unemployment (Burfisher Table ME 3.4) ──────────────────────────
# Fix the nominal factor return (pe → exo at 0); let endowment supply (qe) adjust.
# Implements unemployment for unskilled labour in a single region (v7):
#
# swap  pe[UnSkLab, Austria] <-> qe[UnSkLab, Austria]
#
# ── 2. Export quantity control ────────────────────────────────────────────────
# Fix bilateral export volume; export tax (txs) endogenises to clear the market.
# fix_at = -30 reduces the quota to 70% of baseline (v7):
#
# swap  qxs[Electricity, Taiwan, Italia] <-> txs[Electricity, Taiwan, Italia] fix_at = -30.0
#
# ── 3. Import quantity control ────────────────────────────────────────────────
# Fix bilateral import volume; bilateral tariff (tms) endogenises (v7):
#
# swap  qxs[Electricity, Taiwan, Italia] <-> tms[Electricity, Taiwan, Italia] fix_at = -30.0
#
# ── 4. Insulate domestic production ──────────────────────────────────────────
# Fix activity output (qo → exo at 0); export subsidy (tx) adjusts to maintain it (v7):
#
# swap  qo[Electricity, Taiwan] <-> tx[Electricity, Taiwan]
#
# ── 5. Variable import levy ───────────────────────────────────────────────────
# Fix the domestic/world price ratio (pr → exo at 0); aggregate import tariff (tm) adjusts (v7):
#
# swap  pr[Electricity, Italia] <-> tm[Electricity, Italia]
#
# ── 6. Balanced government budget (tax replacement) ──────────────────────────
# Fix indirect tax revenue share (del_indtaxr → exo at 0);
# private consumption tax (tpreg) endogenises (v7; v6.22: tp = del_ttaxr):
#
# swap  del_indtaxr[Italia] <-> tpreg[Italia]
#
# ── 7. Government consumption change ─────────────────────────────────────────
# Fix government utility (ug → exo at 0); government demand shift (dpgov) adjusts (v7):
#
# swap  ug[Italia] <-> dpgov[Italia]
#
# ── 8. Fixed savings price ────────────────────────────────────────────────────
# Fix regional savings price (psave → exo at 0); savings demand shift (dpsave) adjusts (v7):
#
# swap  psave[Italia] <-> dpsave[Italia]
#
# ── v6.2 examples ─────────────────────────────────────────────────────────────
# swap  rental[Austria] <-> qo_endw[Land, Austria]
# swap  rental[Austria] <-> qo_endw[UnSkLab, Austria]
# swap  rental[Austria] <-> qo_endw[SkLab, Austria]
# swap  rental[Austria] <-> qo_endw[Capital, Austria]
